<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%">
  <div style="position:absolute;left:4.69%;top:10.94%;width:39.06%;height:78.13%;background:{{ slabColor }}"></div>
  <div style="position:absolute;left:53.13%;top:10.94%;width:40.63%;height:17.19%;background:{{ bracketColor }}"></div>
  <div style="position:absolute;left:53.13%;top:71.88%;width:40.63%;height:17.19%;background:{{ bracketColor }}"></div>
  <div style="position:absolute;left:76.56%;top:10.94%;width:17.19%;height:78.13%;background:{{ bracketColor }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:128,&quot;height&quot;:128},&quot;slabColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#111111&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#111111&quot;,&quot;#FFFFFF&quot;]},&quot;bracketColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#111111&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#111111&quot;,&quot;#FFFFFF&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    return {
      slabColor: this.props.slabColor ?? '#111111',
      bracketColor: this.props.bracketColor ?? '#111111'
    };
  }
}
</script>
</body>
</html>
